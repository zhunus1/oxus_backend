# Backend-only server stack for Test and Production.
# Each server supplies its own deployment/.env; secrets are never built into images.
name: oxus_backend

x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-backend-environment: &backend-environment
  NODE_ENV: production
  STAGING: "${STAGING:-false}"
  PORT: "4000"
  TZ: ${TZ:-Asia/Almaty}
  APP_URL: ${APP_URL}
  FRONTEND_URL: ${FRONTEND_URL}
  EXPERT_DASHBOARD_URL: ${EXPERT_DASHBOARD_URL}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  PGDATABASE: ${POSTGRES_DB}
  PGHOST: db
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-uploads}
  AWS_MINIO_ENDPOINT: http://minio:9000
  AWS_MINIO_PUBLIC_URL: ${AWS_MINIO_PUBLIC_URL}
  CHROME_WS_URL: ws://chrome:3000
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_PROGRAM_SYNC_MODEL: ${OPENAI_PROGRAM_SYNC_MODEL:-gpt-4.1-mini}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  SENDER_EMAIL: ${SENDER_EMAIL}
  SENDER_PASSWORD: ${SENDER_PASSWORD:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SERVER: ${SMTP_SERVER}
  SMTP_SECURE: "${SMTP_SECURE:-false}"
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
  TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
  JITSI_PRIVATE_KEY_PATH: /run/secrets/jitsi-private-key.pk
  JITSI_APP_ID: ${JITSI_APP_ID}
  JAAS_API_KEY_ID: ${JAAS_API_KEY_ID}
  JITSI_DOMAIN: ${JITSI_DOMAIN:-8x8.vc}
  FREEDOM_API_URL: ${FREEDOM_API_URL:-}
  FREEDOM_MERCHANT_ID: ${FREEDOM_MERCHANT_ID:-}
  FREEDOM_RECEIVE_SECRET_KEY: ${FREEDOM_RECEIVE_SECRET_KEY:-}
  FREEDOM_PAYMENT_SECRET_KEY: ${FREEDOM_PAYMENT_SECRET_KEY:-}
  FREEDOM_RESULT_URL: ${FREEDOM_RESULT_URL}
  FREEDOM_FAILURE_URL: ${FREEDOM_FAILURE_URL}
  FREEDOM_SUCCESS_URL: ${FREEDOM_SUCCESS_URL}

services:
  backend:
    image: ${BACKEND_IMAGE}
    init: true
    environment: *backend-environment
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./jitsi-private-key.pk:/run/secrets/jitsi-private-key.pk:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      chrome:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  migrator:
    image: ${BACKEND_IMAGE}
    command: ["yarn", "prisma", "migrate", "deploy"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16.0-alpine
    environment: *database-environment
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9090}:9090"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  chrome:
    image: browserless/chrome:latest
    environment:
      CONNECTION_TIMEOUT: "60000"
      MAX_CONCURRENT_SESSIONS: "10"
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  minio_data:
