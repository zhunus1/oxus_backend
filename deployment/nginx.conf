user nginx;
worker_processes    5;

events {
    worker_connections   1000;
}

http {
    resolver 127.0.0.11;

    client_max_body_size    128M;
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;
    client_header_buffer_size 8k;
    proxy_temp_file_write_size 256k;
    large_client_header_buffers 4 32k;

    upstream frontend-oxus {
        server oxusedu-frontend:3000;
    }

    upstream frontend-expert {
        server oxusedu-frontend-expert:3000;
    }
    
    upstream frontend-admin {
        server oxusedu-frontend-admin:3000;
    }
    
    upstream backend {
        server oxusedu-backend:4000;
    }

    upstream minio {
        server oxusedu-minio:9000;
    }

    server {
        listen             80;

        location / {
            proxy_pass  http://frontend-oxus;
            proxy_set_header Host $http_host;
	    proxy_set_header X-Real-IP $http_x_real_ip;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        }

        location /api {
            proxy_pass  http://backend;
            proxy_set_header Host $http_host;
	    proxy_set_header X-Real-IP $http_x_real_ip;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        }
        
	location /storage {
            proxy_pass  http://minio;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    server {
        listen             81;

        location / {
            proxy_pass  http://frontend-expert;
            proxy_set_header Host $http_host;
       	    proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        }

        location /api {
            proxy_pass  http://backend;
            proxy_set_header Host $http_host;
       	    proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        }
        
	location /storage {
            proxy_pass  http://minio;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    server {
        listen             82;

        location / {
            proxy_pass  http://frontend-admin;
            proxy_set_header Host $http_host;
       	    proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        }

        location /api {
            proxy_pass  http://backend;
            proxy_set_header Host $http_host;
       	    proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        }
        
	location /storage {
            proxy_pass  http://minio;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

