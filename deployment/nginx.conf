# Host Nginx bootstrap configuration for the backend-only Test environment.
# Install as /etc/nginx/conf.d/oxus-backend.conf, then let Certbot add HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name test.oxusedu.com expert.test.oxusedu.com admin.test.oxusedu.com;

    client_max_body_size 128M;

    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # The trailing slash removes the public /storage/ prefix before forwarding
    # requests to MinIO, where the next path component is the bucket name.
    location /storage/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontends are intentionally not part of this first deployment.
    location / {
        default_type application/json;
        add_header Retry-After 300 always;
        return 503 '{"service":"oxus-backend","message":"Frontend is not deployed yet"}';
    }
}
